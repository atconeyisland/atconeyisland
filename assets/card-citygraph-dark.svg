  <text x="1128" y="146" fill="#94A3B8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">and shortest routes</text>
  <text x="1128" y="174" fill="#94A3B8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">Leaflet map interface</text>
  <circle cx="1450" cy="118" r="18" fill="#60A5FA"/>
  <circle cx="1510" cy="72" r="18" fill="#60A5FA"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 236" width="1600" height="236" role="img" aria-label="05. CityGraph: Interactive city graph visualizer with route and traversal algorithms.">
  <title>05. CityGraph: Interactive city graph visualizer with route and traversal algorithms.</title>
  <rect x="2" y="2" width="1596" height="232" rx="20" fill="#0F172A" stroke="#1E3A8A" stroke-width="2"/>
  <text x="112" y="42" fill="#60A5FA" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="4">GRAPHS · ALGORITHMS · MAPS</text>
  <text x="42" y="122" fill="#60A5FA" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">05</text>
  <text x="112" y="118" fill="#F1F5F9" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" letter-spacing="-1">CityGraph</text>
  <text x="112" y="164" fill="#94A3B8" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400">Interactive graph routing with road-based shortest paths and DFS.</text>

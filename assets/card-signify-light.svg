<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 236" width="1600" height="236" role="img" aria-label="04. Signify: Indian Sign Language interpreter with 99.99 percent test accuracy.">
  <title>04. Signify: Indian Sign Language interpreter with 99.99 percent test accuracy.</title>
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.4" fill="#2563EB"/></pattern>

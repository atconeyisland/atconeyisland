  <rect x="2" y="2" width="1596" height="232" rx="20" fill="#F8FAFC" stroke="#BFDBFE" stroke-width="2"/>
  <text x="112" y="42" fill="#2563EB" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="4">COMPUTER VISION · ISL</text>
  <text x="42" y="122" fill="#2563EB" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">04</text>
